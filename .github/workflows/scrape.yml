name: Oman SME Intel Scraper

on:
  # Manual runs only. To scrape on a schedule, add back e.g.
  #   schedule:
  #     - cron: '0 1 * * 1,4'   # Mon + Thu, 5 AM Gulf time
  workflow_dispatch:
    inputs:
      sources:
        description: 'Scraper to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - oia_list
          - tender_vendor_registry
          - tender_board
          - tender_awards
          - riyada
          - moci
          - jsrs
          - msx

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run all scrapers (scheduled)
        if: ${{ github.event_name == 'schedule' }}
        env:
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID:  ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          JSRS_BUYER_MODE:    ${{ secrets.JSRS_BUYER_MODE }}
          JSRS_USERNAME:      ${{ secrets.JSRS_USERNAME }}
          JSRS_PASSWORD:      ${{ secrets.JSRS_PASSWORD }}
          WORKER_URL:         ${{ secrets.WORKER_URL }}
          BROWSE_TOKEN:       ${{ secrets.BROWSE_TOKEN }}
        run: python run_scrapers.py --source all

      - name: Run selected scraper (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID:  ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          JSRS_BUYER_MODE:    ${{ secrets.JSRS_BUYER_MODE }}
          JSRS_USERNAME:      ${{ secrets.JSRS_USERNAME }}
          JSRS_PASSWORD:      ${{ secrets.JSRS_PASSWORD }}
          WORKER_URL:         ${{ secrets.WORKER_URL }}
          BROWSE_TOKEN:       ${{ secrets.BROWSE_TOKEN }}
        run: python run_scrapers.py --source ${{ github.event.inputs.sources }}

      - name: Trigger AI batch enrichment
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN:  ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️  WORKER_URL secret not set - skipping AI enrichment."
            echo "    Deploy the Cloudflare Worker and add WORKER_URL to repo secrets."
            exit 0
          fi
          echo "Triggering Workers AI enrichment for new leads..."
          curl -s -X POST "$WORKER_URL/enrich/batch" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            print(f'✅ Enriched: {data.get(\"success\",0)} | Failed: {data.get(\"failed\",0)} | Total: {data.get(\"total\",0)}')
          except:
            print('Enrichment response received')
          "
